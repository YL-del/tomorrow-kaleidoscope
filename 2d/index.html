<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明日万花筒 2D · 里世界版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0d0b09; overflow: hidden;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", "Noto Serif SC", serif; user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; aspect-ratio: 16/9; max-width: 100vw; max-height: 100vh; width: 100%; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: auto; }

  /* 覆盖层 */
  #grain { position: absolute; inset: 0; z-index: 13; pointer-events: none; opacity: .5; mix-blend-mode: overlay; }
  #vignette { position: absolute; inset: 0; z-index: 12; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(10,7,4,.55) 100%); }
  body.in-other #vignette { background: radial-gradient(ellipse at center, transparent 40%, rgba(30,6,4,.7) 100%); }
  #scan { position: absolute; inset: 0; z-index: 14; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.06) 3px 4px); }

  /* HUD */
  #hud { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  #room-label { position: absolute; top: 14px; left: 22px; color: #e8dcbe; font-size: 24px;
    letter-spacing: 4px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #room-sub { font-size: 12px; letter-spacing: 3px; color: #a8935e; margin-top: 3px; }
  #hud-right { position: absolute; top: 12px; right: 20px; display: flex; align-items: center; gap: 14px; }
  #hearts { font-size: 22px; color: #c33a2e; letter-spacing: 3px; text-shadow: 0 2px 5px rgba(0,0,0,.7); }
  #hearts .off { opacity: .22; filter: grayscale(1); }
  #energy-wrap { width: 150px; height: 10px; background: rgba(12,8,6,.75); border: 1px solid #6e5a34; border-radius: 5px; overflow: hidden; }
  #energy-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #7e1f1a, #c9402e); transition: width .2s; }
  #energy-fill.low { background: linear-gradient(90deg, #4a4a4a, #8a3a2e); }
  .hbtn { pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; border: 1.6px solid #a8842e;
    background: rgba(24,18,12,.8); color: #d8c48a; font-size: 19px; cursor: pointer; }
  .hbtn:hover { background: rgba(60,42,22,.9); }
  #eye-btn.on { background: radial-gradient(circle, #7e1f1a 20%, #3a0f0c 100%); color: #ffd9c8; box-shadow: 0 0 14px rgba(198,42,32,.55); }
  #keyhelp { position: absolute; bottom: 10px; right: 18px; color: rgba(216,196,138,.5); font-size: 13px; letter-spacing: 2px; }

  /* 里世界横幅 */
  #peek-banner { position: absolute; top: 12%; left: 50%; transform: translateX(-50%) translateY(-8px); z-index: 30;
    color: #e8d9c8; font-size: 34px; letter-spacing: 14px; padding: 8px 34px 8px 48px;
    border-top: 1px solid rgba(200,120,90,.6); border-bottom: 1px solid rgba(200,120,90,.6);
    background: rgba(24,10,8,.55); text-shadow: 0 0 18px rgba(198,42,32,.6);
    opacity: 0; pointer-events: none; transition: all .5s; }
  #peek-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 对话框 */
  #dialog { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); width: min(760px, 84%);
    z-index: 40; background: rgba(244,236,214,.96); border: 2px solid #241a06; border-radius: 10px;
    padding: 16px 22px 14px; cursor: pointer; display: none; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #dialog.show { display: block; }
  #dialog-name { display: inline-block; background: #a8842e; color: #f4ecd6; font-size: 14px;
    padding: 2px 12px; border-radius: 4px; margin-bottom: 6px; letter-spacing: 2px; }
  #dialog-text { color: #241a06; font-size: 19px; line-height: 1.65; letter-spacing: .5px; min-height: 30px; }

  /* 行囊 */
  #inv { position: absolute; bottom: 12px; left: 18px; z-index: 20; display: flex; gap: 8px; pointer-events: none; }
  .inv-item { background: rgba(24,18,12,.82); border: 1px solid #6e5a34; border-radius: 6px;
    padding: 5px 10px; color: #d8c48a; font-size: 14px; display: flex; gap: 6px; align-items: center; }
  .inv-empty { color: rgba(216,196,138,.35); font-size: 13px; padding: 6px; letter-spacing: 2px; }

  /* toast */
  #toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); z-index: 35;
    background: rgba(24,18,12,.9); color: #e8dcbe; border: 1px solid #6e5a34; padding: 8px 20px;
    border-radius: 6px; font-size: 15px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }

  /* 标题屏 */
  #title-screen { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; background: rgba(14,11,8,.5); }
  #title-screen.hide, #title-screen:not(.show) { display: none; }
  #title-name { color: #f0e6cc; font-size: 64px; letter-spacing: 22px; text-shadow: 0 0 30px rgba(201,162,39,.35), 0 4px 10px #000; }
  #title-sub { color: #c9b98a; font-size: 17px; letter-spacing: 6px; margin-bottom: 8px; }
  .tbtn { width: 260px; padding: 13px 0; font-size: 21px; letter-spacing: 8px; font-family: inherit;
    border: none; border-radius: 40px; cursor: pointer; color: #f4ecd6; }
  #btn-new { background: linear-gradient(#b0543a, #8e3b32); box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  #btn-new:hover { filter: brightness(1.12); }
  #btn-continue { background: rgba(60,48,30,.85); border: 1px solid #6e5a34; color: #d8c48a; }
  #btn-continue.disabled { opacity: .35; pointer-events: none; }
  #title-keys { color: rgba(216,196,138,.55); font-size: 14px; letter-spacing: 3px; margin-top: 14px; text-align: center; line-height: 2; }

  /* 结局 */
  #end-screen { position: absolute; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px; background: rgba(10,8,6,.72); }
  #end-screen.show { display: flex; }
  #end-title { color: #e8dcbe; font-size: 40px; letter-spacing: 14px; }
  #end-text { color: #c9b98a; font-size: 19px; line-height: 2.2; text-align: center; letter-spacing: 2px; }
#end-next { display: none; margin-top: 6px; padding: 12px 34px; background: none; border: 1px solid rgba(216,196,138,.5); color: #e8dcbe;
font-size: 18px; letter-spacing: 4px; cursor: pointer; font-family: inherit; }
#end-next:hover { background: rgba(216,196,138,.14); }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="gl" width="1280" height="720"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="scan"></div>

  <div id="hud">
    <div id="room-label"></div>
    <div id="hud-right">
      <div id="hearts">❤❤❤</div>
      <div id="energy-wrap" title="瞳力"><div id="energy-fill"></div></div>
      <button id="eye-btn" class="hbtn" title="万花筒之瞳（F）">👁</button>
      <button id="hint-btn" class="hbtn" title="提示（H）">?</button>
    </div>
    <div id="peek-banner">里 世 界</div>
    <div id="toast"></div>
    <div id="inv"></div>
    <div id="keyhelp">WASD 移动 · Shift 疾跑 · E 调查 · F 里世界 · Q 绷带 · M 声音</div>
  </div>

  <div id="dialog"><span id="dialog-name"></span><div id="dialog-text"></div></div>

<div id="end-screen">
<div id="end-title"></div>
<div id="end-text"></div>
<button id="end-next"></button>
</div>

  <div id="title-screen" class="show">
    <div id="title-name">明日万花筒</div>
    <div id="title-sub">看得见里世界的独眼少年 · 2D 手绘版 · 全三章</div>
    <button id="btn-new" class="tbtn">开始新的旅途</button>
    <button id="btn-continue" class="tbtn disabled">继续上次冒险</button>
    <div id="title-keys">
      <b>WASD</b> 移动 · <b>Shift</b> 疾跑 · <b>E</b> 调查 · <b>F</b> 万花筒之瞳（窥见里世界）<br>
      里世界藏着现实看不见的东西——也有一些「住客」。小心你的瞳力。
    </div>
  </div>
</div></div>
<script>window.addEventListener('error', e => { document.title = 'ERR:' + e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno; });</script>
<script type="module" src="./js/game.js?v=28"></script>
<script>
  // 把 grain 画布挂进 DOM
  window.addEventListener('load', () => setTimeout(() => {
    const g = document.getElementById('grain');
    if (g && !g.firstChild) { /* grain 由 game.js 生成后贴上 */ }
  }, 100));
</script>
</body>
</html>
